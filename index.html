<style>
/* REP design system v2. Layers: bg < card < c2. One radius family. Accent lime used for state and primary actions only. */
:root{color-scheme:dark;--bg:#09090a;--card:#141416;--c2:#212125;--track:#34363b;--sep:rgba(255,255,255,.07);--ac:#b6e04a;--ac-ink:#0b0b0c;--tx:#f5f5f7;--mu:#8e8e93;--rd:#ff6b6b;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation;overscroll-behavior:none;font-variant-numeric:tabular-nums}
body{position:fixed;inset:0;width:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,select{-webkit-user-select:text;user-select:text}
/* Shell: the document never scrolls. #app scrolls. The floating tab bar is positioned against the fixed shell, so it cannot move. */
#shell{display:flex;flex-direction:column;position:relative;width:100%;height:var(--vh,100%);overflow:hidden}
#app{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:calc(var(--safe-t) + 16px) max(16px,calc((100% - 560px)/2)) 32px;scroll-padding:80px 0 24px}
#top{flex:none;background:var(--bg);border-bottom:1px solid var(--sep);padding:calc(var(--safe-t) + 8px) max(16px,calc((100% - 560px)/2)) 10px}#top:empty{display:none}#app.under{padding-top:16px}
#app.fade{animation:fade .22s cubic-bezier(.2,.8,.2,1)}
nav{flex:none;display:flex;padding:6px 6px var(--safe-b);background:rgba(14,14,16,.94);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-top:1px solid var(--sep);z-index:10}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:49px;background:none;border-radius:12px;color:var(--mu);font-size:11px;font-weight:600;padding:4px 0}
.tab svg{width:24px;height:24px}.tab.on{color:var(--ac)}
body.kb nav,body.onb nav{display:none}
/* Type */
h1{font-size:34px;font-weight:800;letter-spacing:-.6px;line-height:1.1;margin:4px 0 16px}h1 b{color:var(--ac)}
h2{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);margin:26px 4px 10px}
a{color:inherit;text-decoration:none}a[onclick]{position:relative}a[onclick]::after{content:'';position:absolute;inset:-12px -6px}
.mu{color:var(--mu);font-size:13px}.ac{color:var(--ac)}.dg{color:var(--rd)}
.lb{font-size:11px;font-weight:600;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.bn{white-space:nowrap;font-size:36px;font-weight:800;letter-spacing:-1.2px;line-height:1.05}
/* Layout helpers. minmax(0,1fr) stops wide content from stretching a column past the screen. */
.row{display:flex;align-items:center;gap:10px}.row>button{flex:none}.sp{justify-content:space-between}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px;grid-auto-flow:dense}#hg{grid-auto-rows:minmax(var(--cell),auto)}.span2{grid-column:span 2}.r2{grid-row:span 2}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin-bottom:12px}
/* Surfaces */
.card,.tile,.stat,.grp{background-color:var(--card);background-image:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 55%);border:1px solid rgba(255,255,255,.05);border-radius:var(--r-lg)}
.card{padding:16px;margin-bottom:12px}.tile{padding:16px;position:relative;overflow:hidden}
.stat{padding:14px}.stat b{display:block;font-size:28px;font-weight:800;letter-spacing:-.6px}
.mini{background:var(--c2);border-radius:var(--r-md);padding:12px}
.grp{overflow:hidden;margin-bottom:12px}
.grp>.rw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--sep);min-height:48px}.grp>.rw:first-child{border-top:0}
.info{display:flex;align-items:center;gap:10px;background:var(--c2);border-radius:var(--r-md);padding:10px 12px;margin:10px 0 6px}
.hero{display:flex;justify-content:space-between;align-items:center;background:linear-gradient(135deg,#cdf264,#a2d637);color:var(--ac-ink);border-radius:var(--r-lg);padding:22px 20px;position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(182,224,74,.16)}
.hero::before{content:'';position:absolute;right:-34px;top:-44px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.2)}.hero::after{content:'';position:absolute;right:30px;bottom:-60px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero>*{position:relative;z-index:1}
.hl{font-size:13px;font-weight:600;opacity:.7}.ht{font-size:24px;font-weight:800;letter-spacing:-.4px}.ha{font-size:30px;font-weight:800}
.sticky{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--sep);margin:calc(-16px - var(--safe-t)) -16px 8px;padding:calc(var(--safe-t) + 12px) 16px 12px}
/* Controls: 44pt targets */
button,select{font:inherit;color:var(--tx);border:0;border-radius:var(--r-md);background:var(--c2);padding:0 16px;min-height:44px;font-weight:600;transition:transform .15s cubic-bezier(.3,.9,.3,1),opacity .15s}
button:active,.pill[onclick]:active,.chip:active,[onclick]:active{opacity:.8}button:active{transform:scale(.96)}
.pri{background:var(--ac);color:var(--ac-ink);font-weight:700}
.sm{min-height:34px;padding:0 12px;font-size:14px;position:relative}.sm::after{content:'';position:absolute;inset:-5px}
.big{width:100%;min-height:54px;font-size:17px;border-radius:16px}
.back{width:44px;height:44px;min-height:44px;flex:none;padding:0;margin-left:-8px;display:flex;align-items:center;justify-content:center;background:transparent;border-radius:50%;color:var(--tx)}.back:active{background:var(--c2);transform:none}.back svg{width:24px;height:24px}
.tf{width:auto;min-height:32px;padding:0 10px;font-size:13px;border-radius:10px}

.chip{display:inline-flex;align-items:center;min-height:36px;background:var(--c2);padding:0 14px;border-radius:18px;margin:0 6px 6px 0;font-size:14px;white-space:nowrap}.chip.on{background:var(--ac);color:var(--ac-ink)}
.pill{display:inline-flex;align-items:center;white-space:nowrap;min-height:28px;padding:0 12px;border-radius:14px;font-size:12px;font-weight:700;background:var(--c2);position:relative}.pill[onclick]::after{content:'';position:absolute;inset:-8px}.pill.on{background:var(--ac);color:var(--ac-ink)}
.med{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--c2);flex:none}

.rzing{outline:2px solid var(--ac);outline-offset:2px}
.rm{position:absolute;top:-6px;left:-6px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);border:1px solid var(--sep);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;z-index:3}.rm::after{content:'';position:absolute;inset:-8px}
